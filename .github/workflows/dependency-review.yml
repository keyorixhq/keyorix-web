name: Dependency Review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block any PR that introduces a high or critical known-vulnerable package.
          fail-on-severity: high
          # Mirror the same suppression as scripts/audit-check.mjs:
          # react-router RSC-mode CSRF — not reachable in a SPA build.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
          # Post a PR comment summarising what changed so reviewers have context
          # even when the check passes.
          comment-summary-in-pr: always

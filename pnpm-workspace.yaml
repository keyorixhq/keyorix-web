allowBuilds:
  esbuild: true

# form-data <4.0.6 has a CRLF-injection advisory (GHSA-hmw2-7cc7-3qxx); axios
# pulls a vulnerable range transitively.
overrides:
  form-data@>=4.0.0 <4.0.6: ^4.0.6

# GHSA-qwww-vcr4-c8h2: react-router RSC-mode CSRF bypass, patched only in
# v8.3.0 (breaking major). This app uses react-router-dom in SPA mode without
# RSC, so the vulnerable code path is not reachable.
auditConfig:
  ignoreCves:
    - GHSA-qwww-vcr4-c8h2
